{% extends "auth_base.html" %}
{% block title %}Welcome back · Notelet{% endblock %}
{% block auth_content %}
<div class="auth-heading"><p class="eyebrow muted">WELCOME BACK</p><h2>Good to see you.</h2><p>Sign in to continue to your notes.</p></div>
<form method="post" class="auth-form">
  <label>Email address<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required autofocus></label>
  <label>Password<span class="password-wrap"><input type="password" name="password" placeholder="Your password" autocomplete="current-password" required><button class="toggle-password" type="button" aria-label="Show password">Show</button></span></label>
  <button class="button button-primary button-full" type="submit">Sign in <span>→</span></button>
</form>
<p class="auth-switch">New to Notelet? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
